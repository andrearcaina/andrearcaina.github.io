name: CI

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install frontend dependencies
              run: make install-web

            - name: Install golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.15.0
                  install-only: true

            - name: Run fix, format, vet, lint, test
              run: make check

            - name: Build binary file and web assets
              run: make build

            - name: Clean up
              run: make clean