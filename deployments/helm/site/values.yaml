# VM 2 is the production worker in this cluster.
nodeSelector:
    kubernetes.io/hostname: homelab-vm2

secret:
    name: andrearcaina-site-secrets

env:
    apiHost: api.andrearcaina.ca
    siteHost: andrearcaina.ca
    allowedOrigins: https://andrearcaina.ca,https://www.andrearcaina.ca,https://andrearcaina.vercel.app,http://localhost:3000,http://localhost:8080
    hevyUsername: andre331
    hevyHeadless: true
    hevyRefreshInterval: 1h

resources:
    requests:
        cpu: 250m
        memory: 256Mi
    limits:
        cpu: 1
        memory: 1Gi

ingress:
    enabled: true
    className: traefik
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
        - andrearcaina.ca
        - www.andrearcaina.ca
        - api.andrearcaina.ca
    path: /
