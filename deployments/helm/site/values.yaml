image:
    repository: ghcr.io/andrearcaina/andrearcaina.github.io
    tag: REPLACE_WITH_COMMIT_SHA
    pullPolicy: IfNotPresent

imagePullSecrets:
    - name: ghcr-auth

# VM 2 is the production worker in this cluster.
nodeSelector:
    kubernetes.io/hostname: homelab-vm2

env:
    apiHost: api.andrearcaina.ca
    siteHost: andrearcaina.ca
    allowedOrigins: https://andrearcaina.ca,https://www.andrearcaina.ca
    spotifyRedirectURI: https://api.andrearcaina.ca/v1/spotify/callback

secret:
    name: andrearcaina-site-secrets

resources:
    requests:
        cpu: 10m
        memory: 32Mi
    limits:
        cpu: 200m
        memory: 256Mi

ingress:
    enabled: true
    className: traefik
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
        - andrearcaina.ca
        - www.andrearcaina.ca
        - api.andrearcaina.ca
    path: /
